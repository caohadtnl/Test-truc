<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Báo cáo ca">
<meta name="theme-color" content="#ea580c">
<title>Báo cáo trực ca Tuần hoàn - Clo</title>
<style>
:root{--orange:#ea580c;--orange2:#f59e0b;--bg:#fffbf5;--card:#fff;--text:#1e293b;--muted:#64748b;--line:#cbd5e1;--ok:#15803d;--danger:#b91c1c;--soft:#fff7ed;--warn:#f59e0b}
*{box-sizing:border-box}html{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}
.topbar{height:44px;background:linear-gradient(135deg,#ea580c,#f59e0b);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;position:sticky;top:0;z-index:50;box-shadow:0 2px 5px rgba(234,88,12,.25)}
.app{max-width:980px;margin:0 auto;padding:6px 10px 80px}.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 0;position:sticky;top:44px;background:rgba(255,251,245,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:40;border-bottom:1px solid #fed7aa;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.tab{white-space:nowrap;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:700;color:#475569;min-height:40px;font-size:14px;flex-shrink:0}.tab.active{background:var(--orange);border-color:var(--orange);color:#fff;box-shadow:0 2px 6px rgba(234,88,12,.3)}
.card{background:var(--card);border:1px solid #fed7aa;border-radius:15px;padding:15px;margin-bottom:14px;box-shadow:0 2px 6px rgba(234,88,12,.05)}.card-title{font-size:16px;font-weight:800;margin:0 0 12px}.section-label{font-size:12.5px;color:var(--muted);font-weight:700;margin:14px 0 8px;text-transform:uppercase;letter-spacing:.03em}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.cwp-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.choice-cwp,.choice{display:flex;align-items:center;justify-content:center;gap:5px;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:7px 4px;min-height:42px;font-weight:700;font-size:13px;color:#334155}.choice{justify-content:flex-start;gap:7px;padding:7px 11px}.choice-cwp input,.choice input{width:18px;height:18px;margin:0;flex-shrink:0}.choice-cwp.is-checked,.choice.is-checked{background:#e0f2fe!important;border-color:#0284c7!important;color:#0369a1!important}
label.field{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:600}
input:not([type=checkbox]),select,textarea{width:100%;max-width:100%;min-width:0;border:1.5px solid var(--line);background:#fff;border-radius:10px;color:var(--text);min-height:44px;padding:9px 10px;font-size:16px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(234,88,12,.15)}textarea{min-height:105px;resize:vertical;line-height:1.45}.metric{margin-top:10px}.sub-panel{background:var(--soft);padding:11px;border-radius:10px;border:1px dashed #fdba74;margin-top:8px}.head4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;text-align:center;font-size:12px;color:var(--muted);margin:0 0 4px}.num4 input{text-align:center;padding-left:1px;padding-right:1px;font-size:15px!important}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;min-height:44px;padding:8px 12px;font-weight:700;color:#334155;display:inline-flex;align-items:center;justify-content:center;text-align:center}.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}.btn.success{background:var(--ok);border-color:var(--ok);color:#fff}.btn.danger{color:var(--danger);border-color:#fecaca;background:#fef2f2}.status{font-size:13px;margin-top:8px;color:var(--ok);font-weight:700}.hidden{display:none!important}.report{min-height:500px;font-family:inherit;line-height:1.5}.report-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.btn-reset-span{grid-column:1/-1}

/* ===== CẢNH BÁO & BẢO VỆ ===== */
[data-alarm-wrap]{margin-top:4px}
.alarm-msg{font-size:12px;font-weight:800;margin-top:5px;padding:6px 8px;border-radius:8px;line-height:1.3}
.alarm-normal{color:#15803d;background:#f0fdf4;border:1px solid #bbf7d0}
.alarm-warn{color:#9a3412;background:#fff7ed;border:1.5px solid #f59e0b}
.alarm-trip{color:#991b1b;background:#fef2f2;border:2px solid #ef4444}
.alarm-input-warn{border-color:#f59e0b!important;background:#fffbeb!important;box-shadow:0 0 0 2px rgba(245,158,11,.12)!important}
.alarm-input-trip{border-color:#dc2626!important;background:#fef2f2!important;box-shadow:0 0 0 2px rgba(220,38,38,.14)!important}
.alarm-legend{font-size:12px;font-weight:700;padding:8px 10px;border-radius:9px;background:#fff7ed;border:1px solid #fed7aa;margin:0 0 10px}
@media(max-width:640px){.app{padding:6px 8px 70px}.grid2{grid-template-columns:1fr}.grid4{gap:4px}.cwp-row{gap:4px}.choice-cwp{font-size:12px;padding:7px 1px}.num4 input{font-size:15px!important;padding:8px 1px}.card{padding:12px}.btn{font-size:14px}}
</style>
</head>
<body>
<header class="topbar">Báo cáo trực ca Tuần hoàn – Clo</header>
<main class="app" id="app">
<div class="tabs">
<button class="tab active" type="button" data-tab="general">Thông tin</button>
<button class="tab" type="button" data-tab="receive">Nhận ca</button>
<button class="tab" type="button" data-tab="during">Trong ca</button>
<button class="tab" type="button" data-tab="handover">Giao ca</button>
<button class="tab" type="button" data-tab="report">Báo cáo</button>
</div>

<section data-page="general">
<div class="card"><h2 class="card-title">Thông tin ca trực</h2><div class="grid2">
<div><label class="field">Ngày trực</label><input id="workDate" type="date"></div>
<div><label class="field">Kíp trực</label><select id="kip"><option value="A">Kíp A</option><option value="B" selected>Kíp B</option><option value="C">Kíp C</option><option value="D">Kíp D</option><option value="E">Kíp E</option></select></div>
<div><label class="field">Loại ca</label><select id="shift"><option value="Sáng|07h00-15h00">Sáng · 07h00–15h00</option><option value="Chiều|15h00-23h00">Chiều · 15h00–23h00</option><option value="Khuya|23h00-07h00">Khuya · 23h00–07h00</option></select></div>
<div><label class="field">Thời gian</label><input id="shiftTime" readonly></div>
</div><div class="metric"><label class="field">1. Nhân sự</label><input id="staff"></div></div>
<div class="card"><h2 class="card-title">3. Bất thường ca trước / Thao tác ca trước</h2><textarea id="previousAbnormal" data-bullet placeholder="Mỗi nội dung một dòng."></textarea></div>
<div class="card"><h2 class="card-title">4. Tồn tại / Bất thường tồn đọng</h2><textarea id="issues" data-bullet placeholder="Mỗi tồn tại một dòng."></textarea></div>
</section>

<section data-page="receive" class="hidden"><div id="receiveMount"></div></section>
<section data-page="during" class="hidden"><div class="card"><h2 class="card-title">II. Trong ca</h2><textarea id="duringText" data-bullet>- VHV kiểm tra định kỳ thiết bị làm việc bình thường.</textarea></div></section>
<section data-page="handover" class="hidden">
<div id="handoverMount"></div>
<div class="card"><h2 class="card-title">IV. Bất thường, khiếm khuyết, lưu ý</h2><textarea id="finalIssues" data-bullet placeholder="Mỗi nội dung một dòng."></textarea></div>
<div class="card"><h2 class="card-title">Người giao / nhận ca</h2><div class="grid2">
<div><label class="field">Giao ca</label><input id="handoverPeople"></div>
<div><label class="field">Kíp nhận ca</label><select id="receiveKip"><option value="">-- Chọn kíp --</option><option value="A">Kíp A</option><option value="B">Kíp B</option><option value="C">Kíp C</option><option value="D">Kíp D</option><option value="E">Kíp E</option></select></div>
<div style="grid-column:1/-1"><label class="field">Nhận ca</label><input id="receivePeople" placeholder="Chọn Kíp nhận ca để tự điền"></div>
</div></div>
</section>
<section data-page="report" class="hidden"><div class="card">
<h2 class="card-title" style="margin:0 0 10px">Báo cáo hoàn chỉnh</h2><textarea id="reportText" class="report" readonly></textarea>
<div class="report-actions"><button class="btn primary" type="button" id="copyMailReport">Chép gửi Mail</button><button class="btn success" type="button" id="copyGroupReport">Chép gửi Group</button><button class="btn danger btn-reset-span" type="button" id="newShift">Bắt đầu ca mới</button></div><div id="status" class="status"></div>
</div></section>
</main>

<script>
(() => {
const app=document.getElementById("app");
const roster={A:["Nguyễn Thành Trung","Đào Ngọc Văn"],B:["Nguyễn Văn Tuấn","Cao Niên Hà"],C:["Lê Hải Phong","Đinh Hoàng Giang"],D:["Nguyễn Hữu Sỹ","Nguyễn Duy Cường"],E:["Phạm Tiến Sỹ","Trịnh Dương Thọ"]};
const U=["1A","1B","2A","2B"], STORE_KEY="qt_shift_report_v15", DEFAULT_DURING_TEXT="- VHV kiểm tra định kỳ thiết bị làm việc bình thường.";
let finalIssuesManualModified=false;
const $=(s,el=app)=>el.querySelector(s), $$=(s,el=app)=>[...el.querySelectorAll(s)];

function phaseHTML(title){return `
<div class="card phase"><h2 class="card-title">${title}</h2>
<div class="metric"><label class="field">Hệ thống bơm tuần hoàn</label><div class="cwp-row">${U.map(u=>`<label class="choice-cwp"><input type="checkbox" data-f="cwp" value="${u}">CWP ${u}</label>`).join("")}</div></div>
<div class="metric"><label class="field">Mức nước đầu kênh 1A/1B/2A/2B (m)</label><div class="head4">${U.map(u=>`<span>${u}</span>`).join("")}</div><div class="grid4 num4">${U.map(()=>`<div data-alarm-wrap><input inputmode="decimal" data-decimal data-f="level"><div data-alarm-msg class="alarm-msg alarm-normal">Bình thường</div></div>`).join("")}</div></div>
<div class="section-label">Lưới chắn rác</div>
<div class="metric"><label class="field">Lưới quay</label><select data-f="screen"><option value="stop">Đang dừng</option><option value="run">Đang chạy</option></select><div class="sub-panel hidden" data-screen-units><label class="field">Lưới quay đang chạy</label><div class="checks">${U.map(u=>`<label class="choice"><input type="checkbox" data-f="screenUnit" value="${u}">${u}</label>`).join("")}</div></div></div>
<div class="metric"><label class="field">Bơm rửa lưới</label><select data-f="washState"><option value="stop">Dừng / Không hoạt động</option><option value="run">Đang hoạt động</option></select><div class="sub-panel hidden" data-wash-details><div class="grid2"><div><label class="field">Bơm rửa lưới đang chạy</label><div class="checks"><label class="choice"><input type="checkbox" data-f="washPump" value="A">Bơm A</label><label class="choice"><input type="checkbox" data-f="washPump" value="B">Bơm B</label></div></div><div><label class="field">Áp suất bơm rửa lưới (MPa)</label><input inputmode="decimal" data-decimal data-f="washPressure"></div></div></div></div>
<div class="metric"><label class="field">Máy cào rác</label><select data-f="rake"><option>Không hoạt động</option><option>Đang hoạt động</option></select></div>
<div class="section-label">Bơm tuần hoàn & CNRV</div>
<div class="metric"><label class="field">Áp suất đầu đẩy bơm tuần hoàn 1A/1B/2A/2B (MPa)</label><div class="head4">${U.map(u=>`<span>${u}</span>`).join("")}</div><div class="grid4 num4">${U.map(()=>`<input inputmode="decimal" data-decimal data-f="dis">`).join("")}</div></div>
<div class="metric"><label class="field">Áp suất dầu thủy lực van CNRV 1A/1B/2A/2B (MPa)</label><div class="head4">${U.map(u=>`<span>${u}</span>`).join("")}</div><div class="grid4 num4">${U.map(()=>`<div data-alarm-wrap><input inputmode="decimal" data-decimal data-f="hp"><div data-alarm-msg class="alarm-msg alarm-normal">Bình thường</div></div>`).join("")}</div></div>
<div class="metric"><label class="field">Nhiệt độ dầu thủy lực van CNRV 1A/1B/2A/2B (°C)</label><div class="head4">${U.map(u=>`<span>${u}</span>`).join("")}</div><div class="grid4 num4">${U.map(()=>`<div data-alarm-wrap><input inputmode="decimal" data-decimal data-f="temp"><div data-alarm-msg class="alarm-msg alarm-normal">Bình thường</div></div>`).join("")}</div></div>
<div class="metric"><label class="field">Mức dầu hệ thống thủy lực van CNRV 1A/1B/2A/2B (Lít)</label><div class="head4">${U.map(u=>`<span>${u}</span>`).join("")}</div><div class="grid4 num4">${U.map(()=>`<div data-alarm-wrap><input inputmode="decimal" data-decimal data-f="oil" value="190"><div data-alarm-msg class="alarm-msg alarm-normal">Bình thường</div></div>`).join("")}</div></div>
<div class="metric"><label class="field">Bơm dầu thủy lực van CNRV 1A/1B/2A/2B</label><div class="head4">${U.map(u=>`<span>${u}</span>`).join("")}</div><div class="grid4">${U.map(()=>`<select data-f="oilPump"><option>A</option><option>B</option></select>`).join("")}</div></div>
<div class="section-label">Hệ thống nhà clo</div>
<div class="metric"><label class="field">Hệ thống nhà clo</label><select data-f="chlorineState"><option value="run">Đang chạy</option><option value="stop" selected>Dừng</option></select></div>
<div class="sub-panel hidden" data-chlorine-active><div class="grid2">
<div><label class="field">Clo cấp nhánh</label><select data-f="chlorineSupply"><option value="">-- Chọn --</option><option>A</option><option>B</option></select></div>
<div><label class="field">Bộ định lượng</label><div class="checks">${["A","B","C","D"].map(x=>`<label class="choice"><input type="checkbox" data-f="meter" value="${x}">${x}</label>`).join("")}</div></div>
<div><label class="field">Xả xuống kênh</label><div class="checks">${U.map(x=>`<label class="choice"><input type="checkbox" data-f="channel" value="${x}">${x}</label>`).join("")}</div></div>
<div style="grid-column:1/-1"><label class="field">Bơm tăng áp nước biển</label><div class="checks">${["A","B","C","D","Không hoạt động"].map(x=>`<label class="choice"><input type="checkbox" data-f="booster" value="${x}">${x}</label>`).join("")}</div></div>
<div style="grid-column:1/-1"><label class="field">Bộ lọc nước biển A/B</label><div class="checks"><label class="choice"><input type="checkbox" data-f="seaFilter" value="A">A</label><label class="choice"><input type="checkbox" data-f="seaFilter" value="B">B</label></div></div>
</div><div class="metric"><label class="field">Nồng độ châm clo 1A/1B/2A/2B (ppm)</label><div class="head4">${U.map(u=>`<span>${u}</span>`).join("")}</div><div class="grid4 num4">${U.map(()=>`<input inputmode="decimal" data-decimal data-f="ppm">`).join("")}</div></div></div>
<div class="metric"><div class="grid2"><div><label class="field">Tổng số bình Clo</label><input inputmode="numeric" data-f="totalCylinder"></div><div><label class="field">Tổng số bình Clo khả dụng</label><input inputmode="numeric" data-f="remainingCylinder"></div></div></div>
<div class="section-label">Hệ thống xử lý & Nước hồi</div>
<div class="grid2 metric"><div><label class="field">Hệ thống trung hòa clo</label><select data-f="neutral"><option value="stop">Dừng / Không hoạt động</option><option value="run">Đang chạy</option></select><div class="sub-panel hidden" data-neutral-fan><label class="field">Quạt hút trung hòa</label><div class="checks"><label class="choice"><input type="checkbox" data-f="neutralFan" value="A">Quạt A</label><label class="choice"><input type="checkbox" data-f="neutralFan" value="B">Quạt B</label></div></div></div>
<div><label class="field">Khối lượng NaOH trong bể chứa (mm)</label><div data-alarm-wrap><input inputmode="text" data-f="naoh" placeholder="Mức NaOH (mm)"><div data-alarm-msg class="alarm-msg alarm-normal">Bình thường</div></div></div>
<div><label class="field">Hệ thống bơm nước hồi</label><select data-f="returnPump"><option value="stop">Ngừng</option><option value="run">Đang chạy</option></select><div class="sub-panel hidden" data-return-pumps><label class="field">Bơm nước hồi đang chạy</label><div class="checks"><label class="choice"><input type="checkbox" data-f="returnPumpUnit" value="A">Bơm A</label><label class="choice"><input type="checkbox" data-f="returnPumpUnit" value="B">Bơm B</label></div></div></div>
<div style="grid-column:1/-1"><div class="grid2"><input inputmode="text" data-f="tankA" placeholder="Mức nước bể A (mm)"><input inputmode="text" data-f="tankB" placeholder="Mức nước bể B (mm)"></div></div></div>
</div>`}

$("#receiveMount").innerHTML=phaseHTML("2. Tình trạng thiết bị đầu ca");
$("#handoverMount").innerHTML=phaseHTML("III. Giao ca");
const receivePhase=$("#receiveMount .phase"),handoverPhase=$("#handoverMount .phase");

function normalizeDotDecimal(v){let s=String(v??"").trim().replace(/,/g,".").replace(/[^0-9.\-]/g,"");const first=s.indexOf(".");if(first!==-1)s=s.slice(0,first+1)+s.slice(first+1).replace(/\./g,"");return s}
function vals(box,f){return $$(`[data-f="${f}"]`,box).map(e=>normalizeDotDecimal(e.value))}
function val(box,f){const e=$(`[data-f="${f}"]`,box);return e?e.value.trim().replace(/,/g,"."):""}
function checked(box,f){return $$(`input[data-f="${f}"]:checked`,box).map(e=>e.value)}
function updateCheckboxVisuals(box){$$('input[type="checkbox"]',box).forEach(cb=>{const p=cb.closest(".choice,.choice-cwp");if(p)p.classList.toggle("is-checked",cb.checked)})}
function updatePanelVisibility(p){
[["[data-f=screen]","[data-screen-units]","run"],["[data-f=washState]","[data-wash-details]","run"],["[data-f=chlorineState]","[data-chlorine-active]","run"],["[data-f=neutral]","[data-neutral-fan]","run"],["[data-f=returnPump]","[data-return-pumps]","run"]].forEach(([s,t,a])=>{const x=$(s,p),y=$(t,p);if(x&&y)y.classList.toggle("hidden",x.value!==a)})
}

/* Chỉ dùng đúng các ngưỡng người dùng cung cấp. Không tự thêm ngưỡng khác. */
function setAlarm(input,state,text){
const wrap=input.closest("[data-alarm-wrap]");if(!wrap)return;
const msg=wrap.querySelector("[data-alarm-msg]");
input.classList.remove("alarm-input-warn","alarm-input-trip");
msg.classList.remove("alarm-warn","alarm-trip","alarm-normal");
if(state==="trip"){input.classList.add("alarm-input-trip");msg.classList.add("alarm-trip")}
else if(state==="warn"){input.classList.add("alarm-input-warn");msg.classList.add("alarm-warn")}
else msg.classList.add("alarm-normal");
msg.textContent=text;
}
function evaluateAlarm(input){
const raw=normalizeDotDecimal(input.value);
if(raw===""){setAlarm(input,"normal","Chưa nhập giá trị");return}
const n=Number(raw),f=input.dataset.f;
if(!Number.isFinite(n)){setAlarm(input,"warn","Giá trị không hợp lệ");return}
if(f==="hp"){
 if(n<8.5)setAlarm(input,"trip","🔴 TRIP – ÁP SUẤT DẦU QUÁ THẤP (< 8.5 MPa)");
 else if(n>18)setAlarm(input,"trip","🔴 TRIP – ÁP SUẤT DẦU QUÁ CAO (> 18.0 MPa)");
 else if(n<14)setAlarm(input,"warn","🟠 CẢNH BÁO THẤP – < 14.0 MPa → Tự khởi động bơm dầu phụ");
 else if(n>16)setAlarm(input,"warn","🟠 CẢNH BÁO CAO – > 16.0 MPa → Tự ngừng bơm dầu");
 else setAlarm(input,"normal","🟢 Bình thường – 14.0–16.0 MPa");
}
else if(f==="temp"){
 if(n>80)setAlarm(input,"trip","🔴 TRIP – NHIỆT ĐỘ DẦU QUÁ CAO (> 80 °C)");
 else if(n>70)setAlarm(input,"warn","🟠 CẢNH BÁO CAO – > 70 °C");
 else setAlarm(input,"normal","🟢 Bình thường – ≤ 70 °C");
}
else if(f==="oil"){
 if(n<75)setAlarm(input,"trip","🔴 TRIP – MỨC DẦU QUÁ THẤP (< 75 L)");
 else if(n<100)setAlarm(input,"warn","🟠 CẢNH BÁO THẤP – < 100 L");
 else setAlarm(input,"normal","🟢 Bình thường – ≥ 100 L (định mức khoảng 190 L)");
}
else if(f==="naoh"){
 if(n<450)setAlarm(input,"trip","🔴 LL – NGUY HIỂM: < 450 mm → Dừng bơm tuần hoàn & bơm nhập/cấp NaOH");
 else if(n>2460)setAlarm(input,"trip","🔴 HH – NGUY HIỂM: > 2460 mm → Dừng bơm nhập và cấp NaOH");
 else if(n<600)setAlarm(input,"warn","🟠 CẢNH BÁO THẤP – Alarm L: < 600 mm");
 else if(n>2360)setAlarm(input,"warn","🟠 CẢNH BÁO CAO – Alarm H: > 2360 mm");
 else setAlarm(input,"normal","🟢 Bình thường – 600–2360 mm");
}
else if(f==="level"){
 if(n>=8420)setAlarm(input,"trip","🔴 TRIP – MỨC NƯỚC ĐẦU KÊNH ≥ 8420 mm → Ngừng bơm CWP");
 else setAlarm(input,"normal","🟢 Bình thường – chưa đạt ngưỡng Trip 8420 mm");
}
}
function evaluateAllAlarms(box){$$('input[data-f="hp"],input[data-f="temp"],input[data-f="oil"],input[data-f="naoh"],input[data-f="level"]',box).forEach(evaluateAlarm)}

function syncReceiveToHandover(){
const src=$$("input,select",receivePhase),dst=$$("input,select",handoverPhase);
src.forEach((s,i)=>{const d=dst[i];if(!d)return;const f=d.dataset.f;if(["level","dis","hp","temp","ppm","tankA","tankB","naoh","washPressure"].includes(f))return;if(s.type==="checkbox")d.checked=s.checked;else d.value=s.value});
updateCheckboxVisuals(handoverPhase);updatePanelVisibility(handoverPhase);evaluateAllAlarms(handoverPhase);saveDraft();
}
function setupDynamicPhaseEvents(box,isReceive=false){
["screen","washState","chlorineState","neutral","returnPump"].forEach(f=>{const e=$(`[data-f="${f}"]`,box);if(e)e.addEventListener("change",()=>{updatePanelVisibility(box);if(isReceive)syncReceiveToHandover();saveDraft()})});
$$('input[type="checkbox"]',box).forEach(cb=>cb.addEventListener("change",()=>{updateCheckboxVisuals(box);if(isReceive)syncReceiveToHandover();saveDraft()}));
$$('select',box).forEach(sel=>sel.addEventListener("change",()=>{if(isReceive)syncReceiveToHandover();saveDraft()}));
$$('input:not([type="checkbox"])',box).forEach(el=>{el.addEventListener("input",()=>{if(el.hasAttribute("data-decimal"))el.value=normalizeDotDecimal(el.value);evaluateAlarm(el);saveDraft()});el.addEventListener("change",()=>{if(el.hasAttribute("data-decimal"))el.value=normalizeDotDecimal(el.value);evaluateAlarm(el);saveDraft()})});
const booster=$$('input[data-f="booster"]',box);booster.forEach(el=>el.addEventListener("change",()=>{if(el.value==="Không hoạt động"&&el.checked)booster.forEach(x=>{if(x!==el)x.checked=false});else if(el.checked){const none=booster.find(x=>x.value==="Không hoạt động");if(none)none.checked=false}updateCheckboxVisuals(box);if(isReceive)syncReceiveToHandover();saveDraft()}));
}
setupDynamicPhaseEvents(receivePhase,true);setupDynamicPhaseEvents(handoverPhase,false);

$$("textarea[data-bullet]").forEach(tx=>{tx.addEventListener("focus",()=>{if(!tx.value.trim())tx.value="- "});tx.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();const p=tx.selectionStart,b=tx.value.substring(0,p),a=tx.value.substring(tx.selectionEnd);tx.value=b+"\n- "+a;tx.selectionStart=tx.selectionEnd=p+3;saveDraft()}});tx.addEventListener("input",saveDraft)});
$("#finalIssues").addEventListener("input",()=>{finalIssuesManualModified=true});
function setCurrentDateIfEmpty(){if($("#workDate").value)return;const d=new Date();$("#workDate").value=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function syncShift(){$("#shiftTime").value=$("#shift").value.split("|")[1]}
function syncRoster(force=false){const p=(roster[$("#kip").value]||[]).join(", ");if(force||!$("#staff").value.trim())$("#staff").value=p;if(force||!$("#handoverPeople").value.trim())$("#handoverPeople").value=p}
function syncReceiveRoster(){const k=$("#receiveKip").value;if(k)$("#receivePeople").value=roster[k].join(", ")+` ( Kíp ${k})`}
$("#shift").addEventListener("change",()=>{syncShift();saveDraft()});$("#kip").addEventListener("change",()=>{syncRoster(true);saveDraft()});$("#receiveKip").addEventListener("change",()=>{syncReceiveRoster();saveDraft()});["#workDate","#staff","#handoverPeople","#receivePeople"].forEach(s=>$(s).addEventListener("input",saveDraft));
$("#issues").addEventListener("input",()=>{if(!finalIssuesManualModified)$("#finalIssues").value=$("#issues").value});
function cleanBulletText(text,compact=false){const a=String(text||"").split(/\n+/).map(x=>x.trim()).filter(x=>x.replace(/^[-•*]\s*/,"").trim());return a.map(x=>"- "+x.replace(/^[-•*]\s*/,"").trim()).join(compact?"\n":"\n\n")}
function vnDate(s){const a=String(s||"").split("-");return a.length===3?`${a[2]}/${a[1]}/${a[0]}`:s}
function chlorineDetail(p){const m=checked(p,"meter"),c=checked(p,"channel"),s=val(p,"chlorineSupply"),a=[];if(s)a.push(`đang chạy clo nhánh cấp ${s}`);if(m.length)a.push(`qua bộ định lượng ${m.join(", ")}`);if(c.length)a.push(`xả châm liên tục xuống kênh ${c.join(", ")}`);return a.join(" ")}
function boosterText(p){const a=checked(p,"booster");if(!a.length)return "";if(a.includes("Không hoạt động"))return "Không hoạt động";return `đang chạy bơm ${a.join(", ")}`}
function seaFilterText(p){const f=checked(p,"seaFilter");return f.length?`Lọc ${f.join(", ")}`:"Đang dừng"}
function washText(p){if(val(p,"washState")!=="run")return "Dừng / Không hoạt động";const q=checked(p,"washPump"),r=val(p,"washPressure");let s="Đang hoạt động";if(q.length)s+=` bơm ${q.join(", ")}`;if(r)s+=`, áp suất: ${r} MPa`;return s}
function neutralText(p){if(val(p,"neutral")!=="run")return "Dừng / Không hoạt động";const f=checked(p,"neutralFan");return "Đang chạy"+(f.length?` quạt ${f.join(", ")}`:"")}
function returnPumpText(p){if(val(p,"returnPump")!=="run")return "Ngừng";const q=checked(p,"returnPumpUnit");return "Đang chạy"+(q.length?` bơm ${q.join(", ")}`:"")}
function phaseText(p,isGroup=false){
const c=checked(p,"cwp"),screen=val(p,"screen")==="run"?`đang chạy lưới quay${checked(p,"screenUnit").length?" "+checked(p,"screenUnit").join(", "):""}`:"đang dừng",naoh=val(p,"naoh"),tankA=val(p,"tankA"),tankB=val(p,"tankB"),tc=val(p,"totalCylinder"),rc=val(p,"remainingCylinder");
let dis=vals(p,"dis").filter(Boolean).join("/")||"";if(dis&&!dis.toLowerCase().includes("mpa"))dis+=" MPa";let temp=vals(p,"temp").filter(Boolean).join("/")||"";if(temp&&!temp.includes("°C"))temp+=" °C";let cwp=c.length?`chạy bơm tuần hoàn ${c.map(x=>"CWP "+x).join(", ")}`:"Đang dừng";
const l=[`- Hệ thống bơm tuần hoàn: ${cwp}`,`- Mức nước đầu kênh 1A/1B/2A/2B: ${vals(p,"level").join("/")}m`,`- Tình trạng hoạt động của lưới quay: ${screen}`,`- Tình trạng hoạt động của bơm rửa lưới: ${washText(p)}`,`- Tình trạng hoạt động của máy cào rác: ${val(p,"rake")}`,`- Áp suất đầu đẩy bơm tuần hoàn 1A/1B/2A/2B: ${dis}`,`- Áp suất hệ thống dầu thủy lực van CNRV 1A/1B/2A/2B: ${vals(p,"hp").join("/")} MPa`,`- Nhiệt độ dầu thủy lực van CNRV 1A/1B/2A/2B: ${temp}`,`- Mức dầu hệ thống thủy lực van CNRV 1A/1B/2A/2B: ${vals(p,"oil").join("/")} lít`,`- Bơm dầu thủy lực van CNRV 1A/1B/2A/2B: Bơm ${$$('[data-f="oilPump"]',p).map(x=>x.value).join("/")}`];
if(val(p,"chlorineState")==="run"){l.push(`- Hệ thống nhà clo: ${chlorineDetail(p)||"Đang chạy"}`,`- Bơm tăng áp nước biển: ${boosterText(p)}`,`- Bộ lọc nước biển A/B: ${seaFilterText(p)}`,`- Nồng độ châm clo tại kênh 1A/1B/2A/2B: ${vals(p,"ppm").join("/")}`)}else l.push("- Hệ thống nhà clo: Dừng");
l.push(`- Hệ thống trung hòa clo: ${neutralText(p)}`,`- Khối lượng NaOH trong bể chứa: ${naoh?naoh+" mm":""}`,`- Hệ thống bơm nước hồi: ${returnPumpText(p)}`,`- Mức bể nước thu hồi A/B: ${(tankA||tankB)?`${tankA||"0"}/${tankB||"0"} mm`:"0/0 mm"}`);
if(tc||rc)l.push(`- Tổng số bình Clo: ${tc||"0"}`,`- Tổng số bình Clo khả dụng: ${rc||"0"}`);
return l.join(isGroup?"\n":"\n\n");
}
function buildMailReport(){const [sn]=$("#shift").value.split("|");return `Kính gửi: Lãnh đạo PXVH – NMNĐ Quảng Trạch.\n\nCc: CBNV PXVH – NMNĐ Quảng Trạch.\n\nHV Trạm tuần hoàn, clo - Trạm nước lắng, hồi (Kíp ${$("#kip").value}) báo cáo tình hình trực ca ${sn} thử nghiệm ngày: ${vnDate($("#workDate").value)} (từ ${$("#shiftTime").value}) như sau:\n\nI. Nhận ca:\n\n1. Nhân sự: ${$("#staff").value.trim()}\n\n2. Tình trạng thiết bị đầu ca:\n\n${phaseText(receivePhase,false)}\n\n3. Bất thường ca trước:\n\n${cleanBulletText($("#previousAbnormal").value,false)}\n\n4. Tồn tại:\n\n${cleanBulletText($("#issues").value,false)}\n\nII. Trong ca:\n\n${cleanBulletText($("#duringText").value,false)}\n\nIII. Giao ca:\n\n${phaseText(handoverPhase,false)}\n\nIV. Bất thường, khiếm khuyết, lưu ý:\n\n${cleanBulletText($("#finalIssues").value,false)}\n\nGiao ca: ${$("#handoverPeople").value.trim()}\n\nNhận ca: ${$("#receivePeople").value.trim()}\n\nKính báo cáo.\n\nTrân trọng./.`}
function buildGroupReport(){const [sn,sh]=$("#shift").value.split("|");return `Báo cáo TC, TKLM, MT: Tình hình thiết bị vận hành HV Trạm tuần hoàn, clo - Trạm nước lắng , hồi (Kíp ${$("#kip").value}) đầu ca ${sn} ngày ${vnDate($("#workDate").value)} (từ ${sh}) như sau:\nI. Nhận ca:\n1. Nhân sự: ${$("#staff").value.trim()}\n2. Tình trạng thiết bị đầu ca:\n${phaseText(receivePhase,true)}\n3. Thao tác ca trước:\n${cleanBulletText($("#previousAbnormal").value,true)}\n4. Tình trạng bất thường tồn đọng của thiết bị:\n${cleanBulletText($("#issues").value,true)}`}
async function copyText(t,msg){saveDraft();let ok=false;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t);ok=true}}catch(e){}if(!ok){const r=$("#reportText");r.value=t;r.removeAttribute("readonly");r.focus();r.select();try{ok=document.execCommand("copy")}catch(e){}r.setAttribute("readonly",true)}$("#status").textContent=ok?msg:"Đã chọn toàn bộ nội dung — hãy bấm Copy."}
$("#copyMailReport").addEventListener("click",async()=>{const c=buildMailReport();$("#reportText").value=c;await copyText(c,"Đã sao chép nội dung gửi Email.")});
$("#copyGroupReport").addEventListener("click",async()=>{const c=buildGroupReport();$("#reportText").value=c;await copyText(c,"Đã sao chép nội dung gửi Group.")});
function switchTab(t){$$(".tab").forEach(x=>x.classList.toggle("active",x.dataset.tab===t));$$("[data-page]").forEach(p=>p.classList.toggle("hidden",p.dataset.page!==t));if(t==="report")$("#reportText").value=buildMailReport();window.scrollTo({top:0,behavior:"instant"})}
$$(".tab").forEach(b=>b.addEventListener("click",()=>switchTab(b.dataset.tab)));
function serializePhase(p){const o={},g={};$$("[data-f]",p).forEach(e=>(g[e.dataset.f]??=[]).push(e));for(const[k,e]of Object.entries(g))o[k]=e[0].type==="checkbox"?e.filter(x=>x.checked).map(x=>x.value):e.length===1?e[0].value:e.map(x=>x.value);return o}
function restorePhase(p,o={}){const g={};$$("[data-f]",p).forEach(e=>(g[e.dataset.f]??=[]).push(e));for(const[k,e]of Object.entries(g)){if(!(k in o))continue;const v=o[k];if(e[0].type==="checkbox"){const a=Array.isArray(v)?v:[];e.forEach(x=>x.checked=a.includes(x.value))}else if(Array.isArray(v))e.forEach((x,i)=>{if(v[i]!==undefined)x.value=v[i]});else e[0].value=v??""}updateCheckboxVisuals(p);updatePanelVisibility(p);evaluateAllAlarms(p)}
function saveDraft(){try{localStorage.setItem(STORE_KEY,JSON.stringify({workDate:$("#workDate").value,kip:$("#kip").value,shift:$("#shift").value,staff:$("#staff").value,previousAbnormal:$("#previousAbnormal").value,issues:$("#issues").value,duringText:$("#duringText").value,finalIssues:$("#finalIssues").value,finalIssuesManualModified,handoverPeople:$("#handoverPeople").value,receiveKip:$("#receiveKip").value,receivePeople:$("#receivePeople").value,receive:serializePhase(receivePhase),handover:serializePhase(handoverPhase)}))}catch(e){}}
function loadDraft(){try{const r=localStorage.getItem(STORE_KEY);if(!r)return false;const d=JSON.parse(r);["workDate","kip","shift","staff","previousAbnormal","issues","duringText","finalIssues","handoverPeople","receiveKip","receivePeople"].forEach(k=>{if(d[k]!==undefined&&$( "#"+k))$("#"+k).value=d[k]});finalIssuesManualModified=d.finalIssuesManualModified===true;restorePhase(receivePhase,d.receive);restorePhase(handoverPhase,d.handover);return true}catch(e){return false}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")saveDraft()});window.addEventListener("pagehide",saveDraft);
$("#newShift").addEventListener("click",()=>{if(!confirm("Xác nhận bàn giao và khởi tạo ca trực mới?"))return;const inherited=$("#finalIssues").value.trim()?$("#finalIssues").value:$("#issues").value;$$(".phase input[type=checkbox]").forEach(x=>x.checked=false);$$(".phase input:not([type=checkbox])").forEach(x=>x.value="");$$(".phase select").forEach(x=>x.selectedIndex=0);$$('[data-f="oil"]',receivePhase).forEach(x=>x.value="190");$$('[data-f="oil"]',handoverPhase).forEach(x=>x.value="190");$("#previousAbnormal").value="";$("#issues").value=inherited;$("#finalIssues").value=inherited;finalIssuesManualModified=false;$("#duringText").value=DEFAULT_DURING_TEXT;$("#receiveKip").value="";$("#receivePeople").value="";setCurrentDateIfEmpty();syncShift();syncRoster(true);[receivePhase,handoverPhase].forEach(p=>{updateCheckboxVisuals(p);updatePanelVisibility(p);evaluateAllAlarms(p)});saveDraft();switchTab("general")});
const hasDraft=loadDraft();setCurrentDateIfEmpty();syncShift();if(!hasDraft)syncRoster(false);[receivePhase,handoverPhase].forEach(p=>{updateCheckboxVisuals(p);updatePanelVisibility(p);evaluateAllAlarms(p)});
})();
</script>
